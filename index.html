<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#faf9f6">
    <meta name="description" content="Knight 的个人主页。记录学习、实践与思考。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Knight">
    <meta property="og:description" content="记录学习、实践与思考。">
    <title>Knight</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="preload" href="./assets/fonts/maple-mono.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./style.css">
    <script src="./terminal-core.js" defer></script>
    <script src="./terminal.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <div class="page">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Knight 首页">knight<span aria-hidden="true">.</span></a>
        <nav aria-label="主导航">
          <a href="#about">关于</a>
          <a href="https://github.com/pureSaviour">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </header>

      <main id="main">
        <section class="intro" id="about" aria-labelledby="intro-title">
          <p class="eyebrow" aria-hidden="true"><span class="comment">//</span> hello, world</p>
          <h1 id="intro-title">Knight<span class="accent" aria-hidden="true">.</span></h1>
          <!-- 在这里修改个人简介。项目、笔记有真实内容后，再添加对应栏目。 -->
          <p class="description">记录学习、实践与思考。</p>
          <p class="signature" aria-hidden="true"><span class="accent">&gt;</span> stay curious<span class="cursor">_</span></p>
        </section>

        <section class="terminal-section" id="terminal" aria-labelledby="terminal-title" data-terminal>
          <div class="section-heading terminal-heading">
            <h2 id="terminal-title">模拟终端</h2>
            <span class="section-note" aria-hidden="true">just a little shell</span>
          </div>
          <div class="terminal-window">
            <div class="terminal-bar">
              <span class="terminal-label" aria-hidden="true">~/ terminal</span>
              <span data-terminal-path>/home/knight</span>
            </div>
            <div class="terminal-log" role="log" aria-label="终端输出" aria-live="polite" aria-relevant="additions" tabindex="0" data-terminal-log></div>
            <form class="terminal-form" aria-label="终端命令">
              <span class="terminal-prompt" aria-hidden="true" data-terminal-prompt>knight:~ $</span>
              <label class="sr-only" for="terminal-input">输入终端命令</label>
              <input id="terminal-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" maxlength="2048" aria-describedby="terminal-hint terminal-note" placeholder="help" disabled>
            </form>
          </div>
          <p class="terminal-hint" id="terminal-hint" data-terminal-hint>启用 JavaScript 后即可输入命令。</p>
          <p class="terminal-note" id="terminal-note">这里是一套只读虚拟目录，输入仅在当前页面内处理。</p>
          <noscript><p class="terminal-note">浏览器未启用 JavaScript，模拟终端暂不可用。你仍可浏览主页和 GitHub 链接。</p></noscript>
        </section>

        <section class="elsewhere" aria-labelledby="elsewhere-title">
          <div class="section-heading">
            <h2 id="elsewhere-title">找到我</h2>
            <span class="section-note" aria-hidden="true">elsewhere</span>
          </div>
          <a class="profile-link" href="https://github.com/pureSaviour">
            <span class="profile-label">GitHub</span>
            <span class="profile-handle">@pureSaviour</span>
            <span class="profile-arrow" aria-hidden="true">↗</span>
          </a>
        </section>
      </main>

      <footer class="site-footer">
        <span>© 2026 Knight</span>
        <div class="footer-links">
          <a href="./privacy.html">隐私政策</a>
          <a href="https://github.com/pureSaviour/pureSaviour.github.io">查看源码 <span aria-hidden="true">↗</span></a>
        </div>
      </footer>
    </div>
  </body>
</html>
